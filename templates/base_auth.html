<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · 곰팡이 방지 시스템</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
  <div class="shell">
    <section class="art" aria-hidden="true">
      <div class="brand">곰팡팡이.</div>
      {% block art %}{% endblock %}
      <div class="checklist">
        <span><i></i><b></b></span>
        <span><i></i><b class="short"></b></span>
      </div>
      <img class="mascot" src="{{ url_for('static', filename='img/character.svg') }}" alt="">
    </section>

    <main class="panel">
      {% block form %}{% endblock %}
    </main>
  </div>

  <script>
    // 비밀번호 보기/숨기기
    document.querySelectorAll('.eye').forEach(btn => btn.addEventListener('click', () => {
      const input = btn.parentElement.querySelector('input');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.setAttribute('aria-pressed', show);
      btn.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 보기');
    }));
  </script>
  {% block script %}{% endblock %}
</body>
</html>
