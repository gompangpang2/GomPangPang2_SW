{% extends "base_auth.html" %}
{% block title %}회원가입{% endblock %}

{% block art %}
<div class="sensor">
  <span class="label">새 옷장 등록</span>
  <strong>+1</strong>
  <div class="bars"><i style="--h:30%"></i><i style="--h:50%"></i><i style="--h:70%"></i><i style="--h:90%"></i></div>
</div>
{% endblock %}

{% block form %}
<h1>회원가입</h1>
<p class="sub">계정을 만들고 우리 집 옷장을 지켜 보세요</p>

<form method="post" action="/signup" id="signup-form">
  <label for="username">아이디</label>
  <div class="box">
    <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    <input id="username" name="username" type="text" value="{{ username or '' }}" autocomplete="username" placeholder="사용할 아이디" required>
  </div>

  <label for="password">비밀번호</label>
  <div class="box">
    <svg class="ico" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <input id="password" name="password" type="password" autocomplete="new-password" placeholder="8자 이상" minlength="8" required>
    <button type="button" class="eye" aria-label="비밀번호 보기" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>

  <label for="password2">비밀번호 확인</label>
  <div class="box">
    <svg class="ico" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="m9 15.5 2 2 4-4"/></svg>
    <input id="password2" name="password2" type="password" autocomplete="new-password" placeholder="비밀번호를 한 번 더" required>
  </div>

  <button type="submit" class="submit">회원가입</button>
</form>

<p class="switch">이미 계정이 있나요? <a href="{{ url_for('login') }}">로그인</a></p>
{% endblock %}

{% block script %}
<script>
  // 비밀번호 확인 불일치 시 제출 막기
  const pw = document.getElementById('password'), pw2 = document.getElementById('password2');
  const check = () => pw2.setCustomValidity(pw2.value && pw2.value !== pw.value ? '비밀번호가 서로 달라요' : '');
  pw.addEventListener('input', check);
  pw2.addEventListener('input', check);
</script>
{% endblock %}
