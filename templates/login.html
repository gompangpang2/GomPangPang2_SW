{% extends "base_auth.html" %}
{% block title %}로그인{% endblock %}

{% block art %}
<div class="sensor">
  <span class="label">옷장 습도</span>
  <strong>62%</strong>
  <div class="bars"><i style="--h:40%"></i><i style="--h:70%"></i><i style="--h:55%"></i><i style="--h:85%"></i></div>
</div>
{% endblock %}

{% block form %}
<h1>로그인</h1>
<p class="sub">옷장 상태를 확인하려면 로그인하세요</p>

<form method="post" action="/login">
  <label for="username">아이디</label>
  <div class="box">
    <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    <input id="username" name="username" type="text" value="{{ username or '' }}" autocomplete="username" placeholder="아이디를 입력하세요" required>
  </div>

  <label for="password">비밀번호</label>
  <div class="box">
    <svg class="ico" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required>
    <button type="button" class="eye" aria-label="비밀번호 보기" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>

  <label class="remember"><input type="checkbox" name="remember"> 로그인 상태 유지</label>

  <button type="submit" class="submit">로그인</button>
</form>

<p class="switch">아직 계정이 없나요? <a href="{{ url_for('signup') }}">회원가입</a></p>
{% endblock %}
