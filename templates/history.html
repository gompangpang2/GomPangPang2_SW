{% extends "base_app.html" %}
{% set active = 'history' %}
{% block title %}습도 기록{% endblock %}
{% block page_class %}history-page{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <h1 id="chart-title">습도 기록</h1>
    <p class="sub">센서별 구간 평균 습도예요. 70%를 넘으면 곰팡이가 자라기 쉬워요.</p>
  </div>
  <div class="range" role="group" aria-label="기간">
    <button type="button" data-range="1h" aria-pressed="false">1시간</button>
    <button type="button" data-range="24h" aria-pressed="true">24시간</button>
    <button type="button" data-range="7d" aria-pressed="false">7일</button>
  </div>
</div>

<section class="chart-card" aria-labelledby="chart-title">
  <div class="chart-wrap">
    <canvas id="hum-chart" role="img" aria-label="센서별 습도 변화 선 그래프"></canvas>
    <p class="empty chart-empty" id="chart-empty" hidden></p>
  </div>
  <details class="table-view">
    <summary>표로 보기</summary>
    <div class="table-scroll"><table id="hum-table"></table></div>
  </details>
</section>
{% endblock %}

{% block script %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
  // 습도 그래프
  const SERIES = ['#6a3fd8', '#eb6834', '#1baf7a', '#eda100'];  // 검증된 순서, 순환 금지
  const INK = '#2a1d47', MUTED = '#8b82a3', GRID = '#eee8f7', MOLD_LINE = 70;
  const colorOf = {};  // 노드 → 색. 처음 본 순서로 고정해서 기간을 바꿔도 색이 안 바뀜
  const pick = node => colorOf[node] ??= SERIES[Object.keys(colorOf).length] || '#9a93ad';
  let range = '24h', chart, times = [];
  // 칸(세로선) 간격(분): 24시간은 30분. 시간 글자는 겹치지 않게 2배씩 늘려서 표시
  const TICK_MIN = { '1h': 10, '24h': 30, '7d': 720 };
  const onStep = (t, step) => (Math.round(t / 60) - new Date(t * 1000).getTimezoneOffset()) % step === 0;
  function tickLabel(scale, i) {
    const t = times[i];
    if (t == null) return null;
    const bucketMin = (times[1] - times[0]) / 60 || 1;
    const pxPerMin = scale.width / (times.length * bucketMin);
    let step = TICK_MIN[range];
    while (step * pxPerMin < 44) step *= 2;
    return onStep(t, step) ? fmt(t) : null;
  }

  const fmt = (t) => {
    const d = new Date(t * 1000), p = n => String(n).padStart(2, '0');
    return range === '7d' ? `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}시` : `${p(d.getHours())}:${p(d.getMinutes())}`;
  };

  // 마우스 위치의 세로선, 70% 주의선, 선 끝 노드 이름
  const overlay = {
    id: 'overlay',
    beforeDatasetsDraw(c) {
      const { ctx, chartArea: a, scales: { x, y } } = c, yy = y.getPixelForValue(MOLD_LINE);
      ctx.save();
      // 칸: TICK_MIN 간격(24시간이면 30분)마다 옅은 세로선
      ctx.strokeStyle = '#efe9fa'; ctx.lineWidth = 1;
      times.forEach((t, i) => {
        if (!onStep(t, TICK_MIN[range])) return;
        const px = Math.round(x.getPixelForValue(i)) + 0.5;
        ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke();
      });
      ctx.strokeStyle = '#c9b9ef'; ctx.setLineDash([5, 5]); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(a.left, yy); ctx.lineTo(a.right, yy); ctx.stroke();
      ctx.setLineDash([]); ctx.fillStyle = MUTED; ctx.font = '600 11px Pretendard Variable, sans-serif';
      ctx.textBaseline = 'bottom'; ctx.fillText('곰팡이 주의 70%', a.left + 6, yy - 4);
      ctx.restore();
    },
    afterDatasetsDraw(c) {
      const { ctx, chartArea: a } = c, act = c.tooltip?.getActiveElements?.() || [];
      ctx.save();
      if (act.length) {
        ctx.strokeStyle = '#b9b2cc'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(act[0].element.x, a.top); ctx.lineTo(act[0].element.x, a.bottom); ctx.stroke();
      }
      if (c.data.datasets.length <= 4) {  // 4개 이하면 선 끝에 이름을 직접 단다
        ctx.fillStyle = INK; ctx.font = '700 12px Pretendard Variable, sans-serif'; ctx.textBaseline = 'middle';
        c.data.datasets.forEach((ds, i) => {
          const pts = c.getDatasetMeta(i).data;
          for (let k = ds.data.length - 1; k >= 0; k--) {
            if (ds.data[k] != null) { ctx.fillText(ds.label, pts[k].x + 8, pts[k].y); break; }
          }
        });
      }
      ctx.restore();
    },
  };

  function renderTable(data) {
    const table = document.getElementById('hum-table');
    table.replaceChildren();
    const head = table.insertRow();
    ['시간', ...data.series.map(s => s.node)].forEach(t => { const th = document.createElement('th'); th.textContent = t; head.appendChild(th); });
    for (let i = data.times.length - 1; i >= 0; i--) {
      if (data.series.every(s => s.hum[i] == null)) continue;
      const row = table.insertRow();
      row.insertCell().textContent = fmt(data.times[i]);
      data.series.forEach(s => { row.insertCell().textContent = s.hum[i] == null ? '–' : `${s.hum[i]}%`; });
    }
  }

  async function loadChart() {
    const empty = document.getElementById('chart-empty');
    let data;
    try {
      data = await getJSON(`{{ url_for("api_history") }}?range=${range}`);
      if (!data) return;
    } catch (e) {
      empty.textContent = e.message || '기록을 불러오지 못했어요.'; empty.hidden = false;
      return;
    }
    empty.hidden = data.series.length > 0;
    empty.textContent = '이 기간에 받은 습도 기록이 없어요.';
    renderTable(data);

    const datasets = data.series.map(s => ({
      label: s.node, data: s.hum,
      borderColor: pick(s.node), backgroundColor: pick(s.node),
      borderWidth: 2, tension: 0.3, spanGaps: false,
      pointRadius: c => { const d = c.dataset.data, i = c.dataIndex; return d[i] != null && d[i - 1] == null && d[i + 1] == null ? 3 : 0; },
      pointHoverRadius: 5, pointHoverBorderWidth: 2, pointHoverBorderColor: '#fff',
    }));
    times = data.times;
    const labels = data.times.map(fmt);

    if (chart) {
      chart.data.labels = labels; chart.data.datasets = datasets;
      chart.options.plugins.legend.display = datasets.length >= 2;
      chart.update();
      return;
    }
    chart = new Chart(document.getElementById('hum-chart'), {
      type: 'line',
      data: { labels, datasets },
      plugins: [overlay],
      options: {
        maintainAspectRatio: false,
        animation: false,
        interaction: { mode: 'index', intersect: false },
        layout: { padding: { right: 72, top: 8 } },
        scales: {
          y: {
            min: 0, max: 100,
            ticks: { stepSize: 25, color: MUTED, callback: v => `${v}%` },
            grid: { color: GRID }, border: { display: false },
          },
          x: {
            ticks: {
              color: MUTED, maxRotation: 0, autoSkip: false,
              callback(v, i) { return tickLabel(this, i); },
            },
            grid: { display: false }, border: { color: GRID },
          },
        },
        plugins: {
          legend: {
            display: datasets.length >= 2, position: 'top', align: 'end',
            labels: { color: INK, usePointStyle: true, pointStyle: 'line', boxWidth: 18 },
          },
          tooltip: {
            backgroundColor: '#fff', titleColor: MUTED, bodyColor: INK,
            borderColor: '#3b2a5a', borderWidth: 2, padding: 10, cornerRadius: 12,
            bodyFont: { weight: '700' }, usePointStyle: true,
            filter: item => item.raw != null,
            callbacks: { label: item => ` ${item.raw}%  ${item.dataset.label}` },
          },
        },
      },
    });
  }

  document.querySelectorAll('.range button').forEach(btn => btn.addEventListener('click', () => {
    range = btn.dataset.range;
    document.querySelectorAll('.range button').forEach(b => b.setAttribute('aria-pressed', b === btn));
    loadChart();
  }));
  loadChart();
  setInterval(loadChart, 15000);
</script>
{% endblock %}
